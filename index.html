// ── In-memory store (works in sandboxed iframes) ──
const mem = {};
function load(k, fb) {
  try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch {}
  return mem[k] !== undefined ? mem[k] : (typeof fb === 'function' ? fb() : fb);
}
function save(k, v) {
  mem[k] = v;
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

function todayKey() { return new Date().toISOString().slice(0, 10); }
function weekNum() { const d = new Date(), j = new Date(d.getFullYear(),0,1); return Math.ceil((((d-j)/86400000)+j.getDay()+1)/7); }
function initials(n) { return (n||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2); }
function todayVerse() { const d = new Date(); return VERSES[(d.getDate()+d.getMonth()*5)%VERSES.length]; }

function genCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:6}, ()=>c[Math.floor(Math.random()*c.length)]).join("");
}

// ── Logo Components ──
function LogoMark({ size = 32, color = "#2d5a35", bg = "none", padding = 0 }) {
  const r = size * 0.29;
  const cx = size / 2;
  const cy = size * 0.46;
  const stemTop = cy + r * 1.32;
  const stemBot = cy + r * 2.05;
  const leafY = stemTop + (stemBot - stemTop) * 0.55;
  const dotR = size * 0.068;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} fill="none" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
      {bg !== "none" && <rect width={size} height={size} rx={size*0.2} fill={bg}/>}
      <circle cx={cx} cy={cy} r={r} stroke={color} strokeWidth={size*0.028} fill="none"/>
      <circle cx={cx} cy={cy - r} r={r} stroke={color} strokeWidth={size*0.028} fill="none"/>
      <circle cx={cx} cy={cy + r} r={r} stroke={color} strokeWidth={size*0.028} fill="none"/>
      <circle cx={cx - r} cy={cy} r={r} stroke={color} strokeWidth={size*0.028} fill="none"/>
      <circle cx={cx + r} cy={cy} r={r} stroke={color} strokeWidth={size*0.028} fill="none"/>
      <path d={`M${cx} ${cy-r*0.95} C${cx+r*0.65} ${cy-r*0.45} ${cx+r*0.88} ${cy} ${cx+r*0.88} ${cy} C${cx+r*0.88} ${cy} ${cx+r*0.65} ${cy+r*0.45} ${cx} ${cy+r*0.95} C${cx-r*0.65} ${cy+r*0.45} ${cx-r*0.88} ${cy} ${cx-r*0.88} ${cy} C${cx-r*0.88} ${cy} ${cx-r*0.65} ${cy-r*0.45} ${cx} ${cy-r*0.95}Z`} fill={color} opacity="0.13"/>
      <path d={`M${cx-r*0.95} ${cy} C${cx-r*0.45} ${cy-r*0.65} ${cx} ${cy-r*0.88} ${cx} ${cy-r*0.88} C${cx} ${cy-r*0.88} ${cx+r*0.45} ${cy-r*0.65} ${cx+r*0.95} ${cy} C${cx+r*0.45} ${cy+r*0.65} ${cx} ${cy+r*0.88} ${cx} ${cy+r*0.88} C${cx} ${cy+r*0.88} ${cx-r*0.45} ${cy+r*0.65} ${cx-r*0.95} ${cy}Z`} fill={color} opacity="0.13"/>
      <circle cx={cx} cy={cy} r={dotR} fill={color}/>
      <line x1={cx} y1={stemBot} x2={cx} y2={stemTop} stroke={color} strokeWidth={size*0.028} strokeLinecap="round"/>
      <path d={`M${cx} ${leafY} Q${cx-r*0.72} ${leafY-r*0.38} ${cx-r*0.78} ${leafY-r*0.82} Q${cx-r*0.22} ${leafY-r*0.55} ${cx} ${leafY-r*0.28}`} fill={color} opacity="0.78"/>
      <path d={`M${cx} ${leafY} Q${cx+r*0.72} ${leafY-r*0.38} ${cx+r*0.78} ${leafY-r*0.82} Q${cx+r*0.22} ${leafY-r*0.55} ${cx} ${leafY-r*0.28}`} fill={color} opacity="0.78"/>
    </svg>
  );
}

// ── Main App ──
export default function App() {
  const [phase, setPhase] = useState("splash"); // splash | onboard | app
  const [tab, setTab] = useState("today");
  const [obName, setObName] = useState("");
  const [obFocus, setObFocus] = useState("");
  const [profile, setProfile] = useState(null);
  const [checked, setChecked] = useState([]);
  const [weekData, setWeekData] = useState({});
  const [streak, setStreak] = useState(0);
  const [total, setTotal] = useState(0);
  const [weekFocus, setWeekFocusState] = useState("");
  const [modal, setModal] = useState(null); // null | { type, data }
  const [nudge, setNudge] = useState(null);
  const [checkinMsg, setCheckinMsg] = useState("");
  const [nudgeEnabled, setNudgeEnabled] = useState(true);
  const [people, setPeople] = useState([]);
  const [groups, setGroups] = useState([]);
  const [feeds, setFeeds] = useState({});

  // Boot
  useEffect(() => {
    const style = document.createElement("style");
    style.textContent = `
      @keyframes dot { 0%,80%,100%{transform:scale(.6);opacity:.3} 40%{transform:scale(1);opacity:1} }
      @keyframes slideUp { from{transform:translateY(100%)} to{transform:none} }
      @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      body { margin:0; background:#f7f4ef; }
      textarea:focus, input:focus, select:focus { border-color:#6b8f71 !important; outline:none; }
      ::-webkit-scrollbar { width:0; }
    `;
    document.head.appendChild(style);

    const p = load("frt_profile", null);
    const wk = load("frt_week", {});
    const s = load("frt_streak", 0);
    const t = load("frt_total", 0);
    const nd = load("frt_nudges", true);
    const pp = load("frt_people", []);
    const gg = load("frt_groups", []);
    const ff = {};
    gg.forEach(g => { ff[g.id] = load("frt_feed_"+g.id, []); });

    setWeekData(wk);
    setStreak(s);
    setTotal(t);
    setNudgeEnabled(nd);
    setPeople(pp);
    setGroups(gg);
    setFeeds(ff);

    if (p) {
      setProfile(p);
      setChecked(load("frt_today_"+todayKey(), []));
      const focus = getWeekFocus(wk);
      setWeekFocusState(focus);
    }

    setTimeout(() => {
      if (p) setPhase("app");
      else setPhase("onboard");
    }, 1600);
  }, []);

  // Schedule nudge prompts
  useEffect(() => {
    if (!nudgeEnabled || phase !== "app") return;
    const timer = setTimeout(() => {
      const p = NUDGES[Math.floor(Math.random() * NUDGES.length)];
      setNudge(p);
    }, (20 + Math.random() * 40) * 60 * 1000);
    return () => clearTimeout(timer);
  }, [nudge, nudgeEnabled, phase]);

  function getWeekFocus(wkData) {
    const stored = load("frt_focus_history", []);
    const key = `${new Date().getFullYear()}-W${weekNum()}`;
    const entry = stored.find(e => e.key === key);
    if (entry) return entry.fruit;
    // suggest weakest fruit
    const fc = {};
    FRUITS.forEach((_,i) => fc[i]=0);
    Object.values(wkData||weekData).forEach(arr => arr.forEach(i => { fc[i]=(fc[i]||0)+1; }));
    const weakest = Object.keys(fc).sort((a,b)=>fc[a]-fc[b])[0];
    const suggested = FRUITS[parseInt(weakest)].name;
    const newEntry = { key, fruit:suggested };
    const updated = [...stored, newEntry].slice(-52);
    save("frt_focus_history", updated);
    return suggested;
  }

  function setFocusFruit(name) {
    const stored = load("frt_focus_history", []);
    const key = `${new Date().getFullYear()}-W${weekNum()}`;
    const idx = stored.findIndex(e => e.key===key);
    const entry = { key, fruit:name };
    const updated = idx>=0 ? stored.map((e,i)=>i===idx?entry:e) : [...stored, entry];
    save("frt_focus_history", updated.slice(-52));
    setWeekFocusState(name);
  }

  function finishOnboard() {
    if (!obName.trim()) return;
    const p = { name:obName.trim(), joined:new Date().toISOString() };
    save("frt_profile", p);
    setProfile(p);
    if (obFocus) setFocusFruit(obFocus);
    else { const f = getWeekFocus({}); setWeekFocusState(f); }
    setPhase("app");
  }

  function toggleFruit(i) {
    const next = checked.includes(i) ? checked.filter(x=>x!==i) : [...checked, i];
    setChecked(next);
    save("frt_today_"+todayKey(), next);
  }

  function saveCheckin() {
    const key = todayKey();
    const wk = { ...weekData, [key]: checked };
    setWeekData(wk);
    save("frt_week", wk);
    const dates = load("frt_checkin_dates", []);
    if (!dates.includes(key)) {
      save("frt_checkin_dates", [...dates, key]);
      const ns = streak+1, nt = total+1;
      setStreak(ns); setTotal(nt);
      save("frt_streak", ns); save("frt_total", nt);
    }
    setCheckinMsg(checked.length > 0 ? `${checked.length} fruit${checked.length>1?"s":""} recorded — keep growing.` : "Check-in saved. Every day is a new beginning.");
    postToGroups("checkin", { fruits: checked.map(i=>FRUITS[i].name) });
    setTimeout(() => setCheckinMsg(""), 3000);
  }

  function postToGroups(type, data) {
    if (!groups.length) return;
    const p = profile || load("frt_profile", {name:"You"});
    groups.forEach(g => {
      const feed = feeds[g.id] || [];
      const body = type==="checkin"
        ? (data.fruits.length>0 ? `Checked in — walked in ${data.fruits.join(", ")} today.` : "Completed their daily check-in.")
        : data.message || "";
      const newFeed = [{ userId:"me", userName:p.name, type, body, fruits:data.fruits||[], at:new Date().toISOString() }, ...feed].slice(0,50);
      setFeeds(f => ({...f, [g.id]: newFeed}));
      save("frt_feed_"+g.id, newFeed);
    });
  }

  const focusFruitObj = FRUITS.find(f=>f.name===weekFocus) || FRUITS[0];
  const focusIdx = FRUITS.indexOf(focusFruitObj);
  const v = todayVerse();
  const wkeys = (() => {
    const keys=[]; const now=new Date(); const dow=now.getDay();
    for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()-(dow-i));keys.push(d.toISOString().slice(0,10));}
    return keys;
  })();
  const DAYS=["S","M","T","W","T","F","S"];
  const h = new Date().getHours();
  const greeting = h<12?"Good morning":h<17?"Good afternoon":"Good evening";

  // ── SPLASH ──
  if (phase==="splash") return (
    <div style={{...S.app, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", height:"100vh"}}>
      <SplashLogo/>
      <div style={{position:"absolute", bottom:48, width:120, height:2, background:"#e8e2d8", borderRadius:2}}>
        <div style={{height:"100%", background:"#6b8f71", borderRadius:2, animation:"barLoad 1.6s ease forwards"}}/>
      </div>
      <style>{`@keyframes barLoad{from{width:0}to{width:100%}} @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}`}</style>
    </div>
  );

  // ── ONBOARDING ──
  if (phase==="onboard") return (
    <div style={{...S.app, overflowY:"auto", height:"100vh"}}>
      <div style={{padding:"48px 28px 48px", maxWidth:400, margin:"0 auto"}}>
        <div style={{display:"flex", justifyContent:"center", marginBottom:20}}><LogoMark size={52} color="#2d5a35"/></div>
        <h1 style={{fontFamily:"Georgia, serif", fontSize:28, fontWeight:300, textAlign:"center", color:"#2a2520", marginBottom:10}}>Welcome to Fruitful</h1>
        <p style={{fontSize:14, color:"#6b5f52", textAlign:"center", lineHeight:1.75, marginBottom:8}}>A daily companion to help you lean into the Holy Spirit — not to replace Him, but to help you stay attentive to His work in your life.</p>
        <div style={{background:"#e8f0e9",border:"1px solid #b8d0bb",borderRadius:10,padding:"12px 16px",marginBottom:28,textAlign:"center"}}>
          <div style={{fontFamily:"Georgia,serif",fontSize:13,fontStyle:"italic",color:"#2d5a35",lineHeight:1.7}}>"Walk in the Spirit, and you shall not fulfill the lust of the flesh."</div>
          <div style={{fontSize:11,color:"#6b8f71",marginTop:5,letterSpacing:".04em"}}>— Galatians 5:16 (NKJV)</div>
        </div>
        <div style={S.field}>
          <label style={S.fieldLabel}>Your name</label>
          <input style={S.input} placeholder="e.g. Jane Doe" value={obName} onChange={e=>setObName(e.target.value)} maxLength={40}/>
        </div>
        <div style={S.field}>
          <label style={S.fieldLabel}>Focus fruit for this week (app will suggest)</label>
          <select style={S.select} value={obFocus} onChange={e=>setObFocus(e.target.value)}>
            <option value="">Let the app suggest for me</option>

        <button style={{...S.btnPrimary, marginTop:8}} onClick={finishOnboard}>Begin my journey</button>

  // ── MAIN APP ──
  const fc = {}; FRUITS.forEach((_,i)=>fc[i]=0);
  Object.values(weekData).forEach(arr=>arr.forEach(i=>{fc[i]=(fc[i]||0)+1}));
  const wkFruits = Object.values(fc).reduce((a,b)=>a+b,0);
  const fruitOrder = focusIdx > 0 ? [focusIdx, ...FRUITS.map((_,i)=>i).filter(i=>i!==focusIdx)] : FRUITS.map((_,i)=>i);

  return (
    <div style={S.app}>
      {/* Header */}
      <div style={S.header}>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <LogoMark size={28} color="#2d5a35"/>
          <span style={S.greet}>{greeting}{profile ? `, ${profile.name.split(" ")[0]}` : ""}</span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          {weekFocus && <div style={S.focusBadge} onClick={()=>setModal({type:"focus"})}>✦ {weekFocus}</div>}
          <div style={S.streakBadge}>🔥 {streak}</div>
        </div>

function TabJournal() {
  const key = todayKey();
  const saved = load("frt_journal_"+key, {});
  const [morning, setMorning] = useState(saved.morning||"");
  const [evening, setEvening] = useState(saved.evening||"");

  function saveJ() {
    const entry={date:key,morning,evening,gratitude,tomorrow};

  );
}

// ══════════════════════════════════════════
function TabPrayer({checked, profile}) {
  const [selected, setSelected] = useState(checked.map(i=>FRUITS[i].name));
  const [intention, setIntention] = useState("");
  const [prayerText, setPrayerText] = useState("");
  const [loading, setLoading] = useState(false);
  const [saved, setSaved] = useState(load("frt_prayers",[]));
  const [saveMsg, setSaveMsg] = useState("");

  function toggleSel(name) { setSelected(s=>s.includes(name)?s.filter(x=>x!==name):[...s,name]); }

  async function build() {
    const fruits = selected.length>0?selected:["love","faithfulness","peace"];
    setLoading(true); setPrayerText("");
    const prompt = `Write a heartfelt, personal Christian prayer (150–180 words) for ${profile?.name||"a believer"}, focusing on these fruits of the Spirit: ${fruits.join(", ")}. Their intention: "${intention||"to walk more closely with God today"}".

Guidelines:
- Ground every fruit mentioned in an accurate NKJV scripture reference
- The prayer should invite and yield to the Holy Spirit, not replace Him — make this explicit
- Begin with "Father," or "Lord," — first-person, intimate and honest
- Reference the specific fruits naturally with their scriptural grounding
- Include a moment of surrender to the Holy Spirit's guidance
- End with Amen.
- Do NOT invent or paraphrase scripture — only use accurate NKJV text`;
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const d = await r.json();
      setPrayerText(d.content.filter(b=>b.type==="text").map(b=>b.text).join(""));
    } catch { setPrayerText("Could not generate prayer right now. Please try again."); }
    setLoading(false);
  }

  function savePrayer() {
    const updated = [{text:prayerText,date:new Date().toISOString()},...saved].slice(0,20);
    setSaved(updated); save("frt_prayers", updated);
    setSaveMsg("Saved!"); setTimeout(()=>setSaveMsg(""),2000);
  }

  return (
    <div style={S.pad}>
      <div style={S.verseCard}><div style={S.verseText}>"Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God."</div><div style={S.verseRef}>— Philippians 4:6</div></div>
      <div style={S.sectionLabel}>Fruits to include</div>
      <div style={S.fruitsGrid}>
        {FRUITS.map((f,i)=>{const on=selected.includes(f.name);return(
          <div key={i} style={S.fruitCard(on,false)} onClick={()=>toggleSel(f.name)}>
            <FruitIcon name={f.icon} size={26} color={on ? "#6b8f71" : "#c8bdb0"}/>
            <div style={S.fcName(on,false)}>{f.name}</div>
          </div>
        );})}
      </div>
      <div style={S.field}>
        <label style={S.fieldLabel}>Your intention</label>
        <textarea style={S.textarea} rows={2} placeholder="e.g. 'Help me be gentler with my words'" value={intention} onChange={e=>setIntention(e.target.value)}/>
      </div>
      <button style={S.btnPrimary} onClick={build}>Build my prayer</button>
      {loading && <Dots/>}
      {prayerText && !loading && (
        <div>
          <div style={{background:"#fff",border:"1px solid rgba(42,37,32,.08)",borderRadius:14,padding:"22px 20px",fontFamily:"Georgia, serif",fontSize:16,fontWeight:300,lineHeight:1.9,color:"#2a2520",whiteSpace:"pre-wrap",marginTop:16}}>{prayerText}</div>
          <button style={{...S.btnSecondary,marginTop:10}} onClick={savePrayer}>🔖 Save this prayer {saveMsg && `— ${saveMsg}`}</button>
        </div>
      )}
      <div style={{background:"#f0ece4",borderRadius:9,padding:"12px 16px",marginTop:16}}>
        <div style={{fontSize:11,color:"#a8998a",lineHeight:1.7,textAlign:"center",fontFamily:"Georgia,serif",fontStyle:"italic"}}>"Likewise the Spirit also helps in our weaknesses. For we do not know what we should pray for as we ought, but the Spirit Himself makes intercession for us." — Romans 8:26 (NKJV)</div>
      </div>
      {saved.length>0 && (
        <div style={{marginTop:20}}>
          <div style={S.sectionLabel}>Saved prayers</div>
          {saved.slice(0,3).map((p,i)=>(
            <div key={i} style={{...S.card,marginBottom:10}}>
              <div style={{fontSize:11,color:"#a8998a",marginBottom:8}}>{new Date(p.date).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"})}</div>
              <div style={{fontFamily:"Georgia, serif",fontSize:13,color:"#6b5f52",lineHeight:1.7}}>{p.text.slice(0,130)}…</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TabCommunity({groups,setGroups,feeds,setFeeds,profile,setModal,postToGroups}) {
  const [activeId, setActiveId] = useState(groups[0]?.id||"");
  const [commTab, setCommTab] = useState("feed");
  const group = groups.find(g=>g.id===activeId)||groups[0];

  function sendNudge(msg) {
    if(!group) return;
    const p = profile||{name:"You"};
    const q = NUDGES[Math.floor(Math.random()*NUDGES.length)].q;
    const body = `Sent a nudge: "${q}"${msg?` — "${msg}"`:""}`;
    const feed = feeds[group.id]||[];
    const newFeed = [{userId:"me",userName:p.name,type:"nudge",body,fruits:[],at:new Date().toISOString()},...feed].slice(0,50);
    setFeeds(f=>({...f,[group.id]:newFeed})); save("frt_feed_"+group.id, newFeed);
  }

  function encourage(groupId, toName) {
    const p = profile||{name:"You"};
    const msgs = [`Encouraged ${toName} — keep walking in the Spirit!`,`Sent love to ${toName}.`,`Cheered on ${toName}'s faithfulness.`];
    const body = msgs[Math.floor(Math.random()*msgs.length)];
    const feed = feeds[groupId]||[];
    const newFeed = [{userId:"me",userName:p.name,type:"encouragement",body,fruits:[],at:new Date().toISOString()},...feed].slice(0,50);
    setFeeds(f=>({...f,[groupId]:newFeed})); save("frt_feed_"+groupId, newFeed);
  }

  return (
    <div style={S.pad}>
      {groups.length>0 && group ? (
        <>
          {groups.length>1 && (
            <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
              {groups.map(g=>(
                <button key={g.id} style={{...S.pillTab(g.id===activeId),flexShrink:0}} onClick={()=>{setActiveId(g.id);setCommTab("feed");}}>{g.name}</button>
              ))}
            </div>
          )}
          <div style={{...S.card,cursor:"default",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:6}}>
              <div style={{fontFamily:"Georgia, serif",fontSize:18,color:"#2a2520"}}>{group.name}</div>
              <span style={{fontFamily:"monospace",background:"#f5ecd8",border:"1px solid #dfc07a",borderRadius:6,padding:"2px 8px",fontSize:12,color:"#b8913a",letterSpacing:".12em"}}>{group.code}</span>
            </div>
            <div style={{fontSize:12,color:"#a8998a"}}>{group.members.length} member{group.members.length!==1?"s":""} · {group.isOwner?"You created this":"Joined"}</div>
            <div style={{display:"flex",marginTop:12}}>
              {group.members.slice(0,5).map((m,i)=>(
                <div key={i} style={{width:28,height:28,borderRadius:"50%",background:"#e8f0e9",border:"2px solid #fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:500,color:"#4a6b50",marginRight:-6}}>{initials(m.name)}</div>
              ))}
            </div>
            {group.isOwner && <button style={{...S.btnGhost,marginTop:12,fontSize:12,padding:"7px 12px"}} onClick={()=>setModal({type:"invite",group})}>+ Invite members</button>}
          </div>
          <div style={S.pillTabs}>
            {["feed","nudge","members"].map(t=>(
              <button key={t} style={S.pillTab(commTab===t)} onClick={()=>setCommTab(t)}>{t==="feed"?"Feed":t==="nudge"?"Send nudge":"Members"}</button>
            ))}
          </div>
          {commTab==="feed" && <FeedList feed={feeds[group.id]||[]} onEncourage={name=>encourage(group.id,name)}/>}
          {commTab==="nudge" && <NudgeForm onSend={sendNudge}/>}
          {commTab==="members" && (
            <div>{group.members.map((m,i)=>(
              <div key={i} style={{...S.card,display:"flex",alignItems:"center",gap:12,padding:"12px 14px"}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:"#e8f0e9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#4a6b50"}}>{initials(m.name)}</div>

              </div>
            ))}</div>
          )}
        </>
      ) : (
        <div style={{textAlign:"center",padding:"40px 0 24px"}}>

      </div>
    </div>
  );

function FeedList({feed,onEncourage}) {
  if(!feed.length) return <div style={{textAlign:"center",fontSize:13,color:"#c8bdb0",padding:20}}>No activity yet — check in today to start the feed!</div>;
  function ago(s){const m=Math.floor((Date.now()-new Date(s))/60000);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";}
  return <div>{feed.slice(0,15).map((item,i)=>(
    <div key={i} style={S.feedItem(item.type==="nudge")}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:"#e8f0e9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#4a6b50",flexShrink:0}}>{initials(item.userName)}</div>
        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500,color:"#2a2520"}}>{item.userId==="me"?"You":item.userName}</div><div style={{fontSize:11,color:"#c8bdb0"}}>{ago(item.at)}</div></div>
        <span style={{fontSize:14,color:item.type==="nudge"?"#b8913a":"#6b8f71"}}>{item.type==="nudge"?"🔔":"✦"}</span>

function TabHarvest({streak,total,wkFruits,fc,weekFocus,focusIdx,profile}) {
  const [report, setReport] = useState(""); const [loading, setLoading] = useState(false);
  async function build() {
    setLoading(true); setReport("");
    const summary = FRUITS.map((f,i)=>`${f.name}: ${fc[i]||0} days`).join(", ");
    const top = FRUITS.filter((_,i)=>fc[i]>=3).map(f=>f.name);
    const growth = FRUITS.filter((_,i)=>(fc[i]||0)<=1).map(f=>f.name);
    const prompt = `Generate a warm, scripturally-grounded monthly spiritual harvest report for ${profile?.name||"a believer"} who has been tracking the fruits of the Spirit. This week's focus fruit: ${weekFocus}. Data: ${summary}. Strongest fruits (practised 3+ days): ${top.join(", ")||"still building consistency"}. Growth areas (0–1 days): ${growth.join(", ")||"doing well across the board"}. Total check-in days: ${total}.

Write in 3 sections:
1. "Your harvest" — celebrate their specific strengths warmly, naming the fruits
2. "Seeds still growing" — gentle, non-shaming encouragement, include ONE accurate NKJV scripture
3. "A word for the season ahead" — a closing challenge that points them toward the Holy Spirit

Important guidelines:
- Use NKJV translation for all scripture quotes
- Only quote scripture accurately — never paraphrase or invent references
- The tone should point the reader toward the Holy Spirit as the source of these fruits, not their own effort
- Be warm, pastoral, and faith-filled. About 200 words.
- Address ${profile?.name||"the reader"} by name once.`;
    try {
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
      const d=await r.json();
      setReport(d.content.filter(b=>b.type==="text").map(b=>b.text).join(""));
    } catch { setReport("Could not generate report right now. Please try again."); }
    setLoading(false);
  }
  return (
    <div style={S.pad}>
      <div style={S.statRow}>
        {[["Streak",streak,"days"],["This week",wkFruits,"fruits"],["Total",total,"days"]].map(([l,v,s])=>(
          <div key={l} style={S.statBox}><div style={S.statVal}>{v}</div><div style={S.statLbl}>{l}</div></div>
        ))}
      </div>
      <div style={S.sectionLabel}>Fruit progress — this week</div>
      {FRUITS.map((f,i)=>{const c=fc[i]||0;const pct=Math.round((c/7)*100);const isFocus=f.name===weekFocus;return(
        <div key={i} style={S.barRow}>
          <span style={{fontSize:12,color:"#6b5f52",width:86,flexShrink:0}}>{f.name}{isFocus?" ✦":""}</span>
          <div style={S.barTrack}><div style={S.barFill(pct,isFocus)}/></div>
          <span style={{fontSize:11,color:"#a8998a",width:24,textAlign:"right"}}>{c}/7</span>
        </div>
      );})}
      <div style={{marginTop:26}}>
        <div style={S.sectionLabel}>Monthly harvest report</div>
        <p style={{fontSize:13,color:"#6b5f52",marginBottom:10,lineHeight:1.65}}>A personal summary of your spiritual growth — strengths, seeds still growing, and a word for the season ahead.</p>
        <div style={{background:"#e8f0e9",borderRadius:9,padding:"10px 14px",marginBottom:14}}>
          <div style={{fontFamily:"Georgia,serif",fontSize:12,fontStyle:"italic",color:"#2d5a35",lineHeight:1.7}}>"He who has begun a good work in you will complete it until the day of Jesus Christ." — Philippians 1:6 (NKJV)</div>
        </div>
        <button style={S.btnPrimary} onClick={build}>Generate my harvest report</button>
      </div>
      {loading && <Dots/>}
      {report && !loading && <div style={{background:"#fff",border:"1px solid rgba(42,37,32,.08)",borderRadius:14,padding:20,fontSize:14,lineHeight:1.8,color:"#2a2520",whiteSpace:"pre-wrap",marginTop:16}}>{report}</div>}
      <div style={{marginTop:28}}>
        <div style={S.sectionLabel}>Reflect</div>
        {REFLECT.map((p,i)=>(
          <ReflectCard key={i} prompt={p}/>

  );
}

  const [open, setOpen] = useState(false); const [text, setText] = useState(""); const [loading, setLoading] = useState(false);

CONCERNS observed: ${concerns.join("; ")||"None recorded yet"}

          </div>
        )}

        <button style={{...S.btnGhost,width:"100%",marginTop:20,color:"#b06060",borderColor:"#f0c0c0"}} onClick={removePerson}>Remove {person.name}</button>
        <button style={{...S.btnGhost,width:"100%",marginTop:8}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

function CreateGroupModal({profile,onClose,onCreated}) {
  const [name,setName]=useState("");
  function create() {
    if(!name.trim()) return;
    const code=genCode(); const id="g_"+Date.now();
    const group={id,name:name.trim(),code,isOwner:true,created:new Date().toISOString(),members:[{name:profile?.name||"You",isMe:true,streak:load("frt_streak",0),joined:new Date().toISOString()}]};
    onCreated(group,[]);
  }
  return (
    <div style={S.modal} onClick={onClose}>
      <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:"Georgia, serif",fontSize:22,fontWeight:300,color:"#2a2520",marginBottom:16}}>Create a group</div>
        <div style={S.field}><label style={S.fieldLabel}>Group name</label><input style={S.input} placeholder="e.g. MAP Fellowship Accountability" value={name} onChange={e=>setName(e.target.value)} maxLength={50}/></div>
        <div style={{display:"flex",gap:10}}>
          <button style={{...S.btnGhost,flex:1}} onClick={onClose}>Cancel</button>
          <button style={{...S.btnPrimary,flex:1}} onClick={create}>Create</button>
        </div>
      </div>
    </div>
  );
}

function JoinGroupModal({profile,onClose,onJoined}) {
  const [code,setCode]=useState("");
  function join() {
    if(code.length<4) return;
    const id="g_"+Date.now();
    const group={id,name:"Accountability Group",code:code.toUpperCase(),isOwner:false,created:new Date().toISOString(),members:[{name:"Group Member",isMe:false,streak:5,joined:new Date(Date.now()-7*86400000).toISOString()},{name:profile?.name||"You",isMe:true,streak:load("frt_streak",0),joined:new Date().toISOString()}]};
    const feed=[{userId:"u1",userName:"Group Member",type:"checkin",body:"Checked in — walked in patience and faithfulness today.",fruits:["Patience","Faithfulness"],at:new Date(Date.now()-3*3600000).toISOString()}];
    onJoined(group,feed);
  }
  return (
    <div style={S.modal} onClick={onClose}>
      <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:"Georgia, serif",fontSize:22,fontWeight:300,color:"#2a2520",marginBottom:16}}>Join a group</div>
        <div style={S.field}><label style={S.fieldLabel}>Invite code</label>
          <input style={{...S.input,textTransform:"uppercase",letterSpacing:".18em",fontSize:22,textAlign:"center"}} placeholder="AB12CD" value={code} onChange={e=>setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""))} maxLength={6}/></div>
        <div style={{display:"flex",gap:10}}>
          <button style={{...S.btnGhost,flex:1}} onClick={onClose}>Cancel</button>
          <button style={{...S.btnPrimary,flex:1}} onClick={join}>Join</button>
        </div>
      </div>
    </div>
  );
}

function InviteModal({group,onClose}) {
  const [copied,setCopied]=useState(false);
  function copy() { navigator.clipboard?.writeText(group.code).then(()=>setCopied(true)).catch(()=>prompt("Copy this code:",group.code)); }
  return (
    <div style={S.modal} onClick={onClose}>
      <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:"Georgia, serif",fontSize:22,fontWeight:300,color:"#2a2520",marginBottom:10}}>Invite to {group.name}</div>
        <p style={{fontSize:14,color:"#6b5f52",marginBottom:8,lineHeight:1.6}}>Share this 6-character code with your accountability partners.</p>
        <div style={S.inviteCode}>{group.code}</div>
        <button style={S.btnPrimary} onClick={copy}>{copied?"✓ Copied!":"Copy invite code"}</button>
        <button style={{...S.btnGhost,width:"100%",marginTop:8}} onClick={onClose}>Done</button>
      </div>
    </div>
  );
}

function DeeperModal({q,onClose}) {
  const [text,setText]=useState(""); const [loading,setLoading]=useState(true);
  useEffect(()=>{
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:`Reflection: "${q}" — Give 3 follow-up questions and one scripture. Warm, spiritually grounded.`}]})})
      .then(r=>r.json()).then(d=>setText(d.content.filter(b=>b.type==="text").map(b=>b.text).join("")))
      .catch(()=>setText("Could not load reflection."))
      .finally(()=>setLoading(false));
  },[]);
  return (
    <div style={S.modal} onClick={onClose}>
      <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:"Georgia, serif",fontSize:18,fontStyle:"italic",color:"#6b5f52",marginBottom:16,lineHeight:1.6}}>"{q}"</div>
        {loading?<Dots/>:<div style={{fontSize:14,color:"#2a2520",lineHeight:1.85,whiteSpace:"pre-wrap"}}>{text}</div>}
        <button style={{...S.btnGhost,width:"100%",marginTop:16}} onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
